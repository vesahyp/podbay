[project]
name = "jeeves-podbay"
version = "0.1.0"
description = "Terminal pod bay for Vesa's local Claude Code sessions"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
]

[project.scripts]
podbay = "podbay.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podbay"]
